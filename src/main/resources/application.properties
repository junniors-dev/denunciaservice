spring.application.name=denunciaservice

# Render inyecta PORT; en local queda 8080
server.port=${PORT:8080}

# Credenciales solo por variables de entorno (en Render: DB_URL, DB_USER, DB_PASSWORD).
# Los valores por defecto apuntan a la MariaDB local de XAMPP.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/denuncias_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
