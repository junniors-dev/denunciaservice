server.port=${PORT:8080}

# En Render se definen DB_URL, DB_USER y DB_PASSWORD; sin ellas usa la MariaDB local de XAMPP
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/denuncias_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

# Ejecuta schema.sql al arrancar, después de Hibernate
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
